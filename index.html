      // Make window.fetch writable so third-party browser extensions and wrappers can safely patch it
      try {
        if (typeof window !== 'undefined') {
          const _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            value: _origFetch ? _origFetch.bind(window) : undefined,
            writable: true,
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Fallback: define setter/getter if value definition fails
        try {
          let _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() { return _currentFetch; },
            set(fn) { _currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      }

      // Suppress unhandled extension errors from halting applet execution
      window.addEventListener('error', function(e) {
        if (e && (
          (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
          (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
